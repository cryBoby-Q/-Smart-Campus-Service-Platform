<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园跑腿 - 骑手接单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            color: white;
            padding: 20px 0;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .rider-info {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .rider-profile {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .rider-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
        }

        .rider-details h3 {
            color: #333;
            font-size: 20px;
            margin-bottom: 5px;
        }

        .rider-details p {
            color: #666;
            font-size: 14px;
        }

        .status-toggle {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-switch {
            position: relative;
            width: 60px;
            height: 30px;
            background: #ddd;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .status-switch.active {
            background: linear-gradient(135deg, #11998e, #38ef7d);
        }

        .status-switch::after {
            content: '';
            position: absolute;
            width: 26px;
            height: 26px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.3s ease;
        }

        .status-switch.active::after {
            left: 32px;
        }

        .rider-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .number {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-item .label {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .section-title {
            color: white;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .order-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .order-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .order-type {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .order-type .icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .order-type.food .icon {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
        }

        .order-type.express .icon {
            background: linear-gradient(135deg, #4ecdc4, #44a08d);
        }

        .order-type.snack .icon {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .order-type .name {
            font-weight: 600;
            color: #333;
            font-size: 18px;
        }

        .reward-badge {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 18px;
        }

        .order-info {
            display: grid;
            gap: 10px;
            margin-bottom: 15px;
        }

        .info-row {
            display: flex;
            gap: 10px;
            color: #666;
        }

        .info-row .label {
            min-width: 70px;
            font-weight: 500;
            color: #333;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .order-time {
            color: #999;
            font-size: 14px;
        }

        .action-btn {
            padding: 10px 25px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-btn.receive {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
        }

        .action-btn.receive:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(17, 153, 142, 0.4);
        }

        .action-btn.complete {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .action-btn.complete:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .empty-state {
            background: white;
            border-radius: 15px;
            padding: 60px 40px;
            text-align: center;
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #666;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #27ae60;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 600px) {
            .rider-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← 返回首页</a>
        
        <div class="header">
            <h1>🚴 骑手接单中心</h1>
        </div>

        <div class="rider-info">
            <div class="rider-profile">
                <div class="rider-avatar">👤</div>
                <div class="rider-details">
                    <h3>张同学</h3>
                    <p>📱 138****8001</p>
                </div>
                <div class="status-toggle">
                    <span id="statusText">在线接单中</span>
                    <div class="status-switch active" id="statusSwitch" onclick="toggleStatus()"></div>
                </div>
            </div>
            <div class="rider-stats">
                <div class="stat-item">
                    <div class="number">128</div>
                    <div class="label">完成订单</div>
                </div>
                <div class="stat-item">
                    <div class="number">¥456</div>
                    <div class="label">累计收入</div>
                </div>
                <div class="stat-item">
                    <div class="number">4.9</div>
                    <div class="label">好评率</div>
                </div>
            </div>
        </div>

        <div class="section-title">
            <span>📋</span> 待接订单
        </div>
        <div class="order-list" id="pendingOrders">
            <!-- 待接订单 -->
        </div>

        <div class="section-title" style="margin-top: 30px;">
            <span>🚚</span> 配送中
        </div>
        <div class="order-list" id="deliveringOrders">
            <!-- 配送中订单 -->
        </div>
    </div>

    <div class="toast" id="toast">接单成功！</div>

    <script>
        // 待接订单数据
        let pendingOrders = [
            {
                id: 1,
                type: '外卖',
                typeClass: 'food',
                icon: '🍔',
                address: '3号楼 302室',
                goods: '黄焖鸡米饭一份，微辣',
                price: 5.00,
                time: '10:30'
            },
            {
                id: 4,
                type: '外卖',
                typeClass: 'food',
                icon: '🍔',
                address: '1号楼 105室',
                goods: '奶茶三杯，少冰',
                price: 6.00,
                time: '11:00'
            }
        ];

        // 配送中订单数据
        let deliveringOrders = [
            {
                id: 2,
                type: '快递',
                typeClass: 'express',
                icon: '📦',
                address: '5号楼 501室',
                goods: '顺丰快递，在菜鸟驿站',
                price: 3.00,
                time: '09:15'
            }
        ];

        let isOnline = true;

        // 切换在线状态
        function toggleStatus() {
            isOnline = !isOnline;
            const switchEl = document.getElementById('statusSwitch');
            const textEl = document.getElementById('statusText');
            
            if (isOnline) {
                switchEl.classList.add('active');
                textEl.textContent = '在线接单中';
            } else {
                switchEl.classList.remove('active');
                textEl.textContent = '离线休息中';
            }
        }

        // 渲染待接订单
        function renderPendingOrders() {
            const container = document.getElementById('pendingOrders');
            
            if (pendingOrders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🎉</div>
                        <h3>暂无新订单</h3>
                        <p>休息一下，新订单马上就来！</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = pendingOrders.map(order => `
                <div class="order-card">
                    <div class="order-header">
                        <div class="order-type ${order.typeClass}">
                            <div class="icon">${order.icon}</div>
                            <div class="name">${order.type}代取</div>
                        </div>
                        <span class="reward-badge">¥${order.price.toFixed(2)}</span>
                    </div>
                    <div class="order-info">
                        <div class="info-row">
                            <span class="label">收货地址:</span>
                            <span>${order.address}</span>
                        </div>
                        <div class="info-row">
                            <span class="label">物品详情:</span>
                            <span>${order.goods}</span>
                        </div>
                    </div>
                    <div class="order-footer">
                        <div class="order-time">发布时间: ${order.time}</div>
                        <button class="action-btn receive" onclick="receiveOrder(${order.id})">📲 立即接单</button>
                    </div>
                </div>
            `).join('');
        }

        // 渲染配送中订单
        function renderDeliveringOrders() {
            const container = document.getElementById('deliveringOrders');
            
            if (deliveringOrders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">✅</div>
                        <h3>暂无配送中订单</h3>
                        <p>快去接单吧！</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = deliveringOrders.map(order => `
                <div class="order-card">
                    <div class="order-header">
                        <div class="order-type ${order.typeClass}">
                            <div class="icon">${order.icon}</div>
                            <div class="name">${order.type}代取</div>
                        </div>
                        <span class="reward-badge">¥${order.price.toFixed(2)}</span>
                    </div>
                    <div class="order-info">
                        <div class="info-row">
                            <span class="label">收货地址:</span>
                            <span>${order.address}</span>
                        </div>
                        <div class="info-row">
                            <span class="label">物品详情:</span>
                            <span>${order.goods}</span>
                        </div>
                    </div>
                    <div class="order-footer">
                        <div class="order-time">接单时间: ${order.time}</div>
                        <button class="action-btn complete" onclick="completeOrder(${order.id})">✅ 确认送达</button>
                    </div>
                </div>
            `).join('');
        }

        // 接单
        function receiveOrder(id) {
            if (!isOnline) {
                alert('请先切换为在线状态');
                return;
            }

            const index = pendingOrders.findIndex(o => o.id === id);
            if (index !== -1) {
                const order = pendingOrders.splice(index, 1)[0];
                deliveringOrders.push(order);
                renderPendingOrders();
                renderDeliveringOrders();
                showToast('接单成功！请尽快配送');
            }
        }

        // 完成订单
        function completeOrder(id) {
            if (confirm('确认订单已送达吗？')) {
                const index = deliveringOrders.findIndex(o => o.id === id);
                if (index !== -1) {
                    deliveringOrders.splice(index, 1);
                    renderDeliveringOrders();
                    showToast('订单已完成！收入已到账');
                }
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 初始化渲染
        renderPendingOrders();
        renderDeliveringOrders();
    </script>
</body>
</html>
