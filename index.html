<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>预约查询首页</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <h1>校园预约系统</h1>

    <!-- 公告栏区域 -->
    <div id="announcement-area" style="background:#f0f7ff; padding:10px; border-radius:8px; margin-bottom:20px;">
        <h3>📢 最新公告</h3>
        <div id="announcement-list">加载中...</div>
    </div>

    <div class="nav">
        <a href="class_query.html">教室查询预约</a>
        <a href="lib_query.html">图书馆座位查询预约</a>
        <a href="my_reserve.html">我的预约记录</a>
        <a href="stats.html">📊 数据统计</a>
          <a href="admin.html">👑 管理员</a>
    </div>
    <p>请选择上方功能模块</p>
</div>

<script>
    // 加载公告列表（在首页显示）
    async function loadAnnouncements() {
        try {
            const res = await fetch('http://localhost:3000/api/announcements');
            const data = await res.json();
            const container = document.getElementById('announcement-list');
            if (data.success && data.data.length > 0) {
                container.innerHTML = '';
                data.data.forEach(ann => {
                    const div = document.createElement('div');
                    div.style.borderBottom = '1px solid #ddd';
                    div.style.padding = '8px 0';
                    div.innerHTML = `
                        <strong>${ann.title}</strong> 
                        <span style="color:gray; font-size:12px;">${ann.create_time}</span>
                        <p style="margin:5px 0 0 0; font-size:14px;">${ann.content}</p>
                    `;
                    container.appendChild(div);
                });
            } else {
                container.innerHTML = '<p>暂无公告</p>';
            }
        } catch (err) {
            console.error('加载公告失败', err);
            document.getElementById('announcement-list').innerHTML = '<p style="color:red;">公告加载失败</p>';
        }
    }

    // 页面加载时调用
    loadAnnouncements();
</script>
</body>
</html>
