<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园跑腿 - 首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            padding: 40px 0;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .service-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .service-card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
        }

        .service-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        .service-card.food .service-icon {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
        }

        .service-card.express .service-icon {
            background: linear-gradient(135deg, #4ecdc4, #44a08d);
        }

        .service-card.snack .service-icon {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .service-card h3 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        .service-card p {
            color: #666;
            margin-bottom: 20px;
        }

        .price-tag {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: white;
            color: #667eea;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
        }

        .btn-secondary:hover {
            background: white;
            color: #667eea;
        }

        .stats {
            background: white;
            border-radius: 20px;
            padding: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            text-align: center;
        }

        .stat-item h2 {
            font-size: 42px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-item p {
            color: #666;
            font-size: 16px;
            margin-top: 10px;
        }

        .footer {
            text-align: center;
            color: white;
            padding: 30px 0;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }
            
            .service-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏃 校园跑腿服务</h1>
            <p>便捷、高效、安全的校园生活助手</p>
        </div>

        <div class="service-cards">
            <div class="service-card food" onclick="goToOrder('外卖')">
                <div class="service-icon">🍔</div>
                <h3>外卖代取</h3>
                <p>食堂、校外美食一键代取，送到宿舍</p>
                <span class="price-tag">¥5 起</span>
            </div>

            <div class="service-card express" onclick="goToOrder('快递')">
                <div class="service-icon">📦</div>
                <h3>快递代取</h3>
                <p>菜鸟驿站、快递柜包裹送货上门</p>
                <span class="price-tag">¥3 起</span>
            </div>

            <div class="service-card snack" onclick="goToOrder('零食')">
                <div class="service-icon">🍟</div>
                <h3>零食代购</h3>
                <p>超市、便利店零食饮料即时配送</p>
                <span class="price-tag">¥4 起</span>
            </div>
        </div>

        <div class="action-buttons">
            <a href="order_add.html" class="btn btn-primary">📝 立即下单</a>
            <a href="order_list.html" class="btn btn-secondary">📋 我的订单</a>
            <a href="rider_receive.html" class="btn btn-secondary">🚴 骑手接单</a>
        </div>

        <div class="stats">
            <div class="stat-item">
                <h2>1000+</h2>
                <p>已完成订单</p>
            </div>
            <div class="stat-item">
                <h2>50+</h2>
                <p>认证骑手</p>
            </div>
            <div class="stat-item">
                <h2>15分钟</h2>
                <p>平均配送时间</p>
            </div>
            <div class="stat-item">
                <h2>99.8%</h2>
                <p>好评率</p>
            </div>
        </div>

        <div class="footer">
            <p>© 2026 校园跑腿服务平台 | 让校园生活更便捷</p>
        </div>
    </div>

    <script>
        function goToOrder(type) {
            window.location.href = 'order_add.html?type=' + encodeURIComponent(type);
        }
    </script>
</body>
</html>
