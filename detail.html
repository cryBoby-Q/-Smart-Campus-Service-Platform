<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信息详情 - 校园失物招领平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center">
            <button onclick="location.href='index.html'" class="mr-4 text-gray-600 hover:text-gray-800">
                <i class="fa fa-arrow-left text-xl"></i>
            </button>
            <div class="w-8 h-8 bg-gradient-to-r from-blue-500 to-blue-600 rounded-lg flex items-center justify-center">
                <i class="fa fa-search text-white text-sm"></i>
            </div>
            <h1 class="text-xl font-bold ml-3 text-gray-800">信息详情</h1>
        </div>
    </nav>

    <div class="max-w-3xl mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-5">
            <div class="flex gap-2">
                <span id="typeTag" class="px-3 py-1.5 rounded-full text-sm font-medium bg-orange-100 text-orange-600">寻物启事</span>
                <span id="statusTag" class="px-3 py-1.5 rounded-full text-sm font-medium bg-blue-100 text-blue-600">未认领</span>
            </div>
            <span id="timeText" class="text-sm text-gray-400"><i class="fa fa-clock-o mr-1"></i>发布时间</span>
        </div>

        <div class="bg-white rounded-2xl p-6 shadow-md border border-gray-100">
            <h2 id="detailTitle" class="text-2xl font-bold text-gray-800 mb-5">加载中...</h2>
            
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-gray-50 rounded-xl p-4">
                    <p class="text-xs text-gray-500 mb-1">物品类型</p>
                    <p id="goodsType" class="font-medium text-gray-800 text-base">-</p>
                </div>
                <div class="bg-gray-50 rounded-xl p-4">
                    <p class="text-xs text-gray-500 mb-1">地点</p>
                    <p id="location" class="font-medium text-gray-800 text-base">-</p>
                </div>
            </div>

            <div class="mb-6">
                <h3 class="font-semibold text-gray-700 mb-3 flex items-center">
                    <i class="fa fa-file-text-o mr-2 text-blue-500"></i>详细描述
                </h3>
                <p id="description" class="text-gray-600 bg-gray-50 p-4 rounded-xl" style="white-space:pre-wrap; word-break:break-word; line-height:1.7;">-</p>
            </div>

            <div class="border-t border-gray-100 pt-5">
                <h3 class="font-semibold text-gray-700 mb-3 flex items-center">
                    <i class="fa fa-phone mr-2 text-green-500"></i>联系方式
                </h3>
                <div class="bg-green-50 rounded-xl p-4 border border-green-100">
                    <p id="contact" class="font-medium text-green-700 text-lg">-</p>
                    <p class="text-xs text-gray-400 mt-1">请在工作时间联系，认领时请携带有效证件</p>
                </div>
            </div>
        </div>

        <button id="claimBtn" onclick="openClaimModal()" class="w-full mt-6 bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white py-3.5 rounded-xl font-medium text-lg transition-all shadow-md flex items-center justify-center space-x-2">
            <i class="fa fa-handshake-o text-xl"></i>
            <span>申请认领</span>
        </button>

        <div class="mt-5 bg-yellow-50 rounded-xl p-5 border border-yellow-100">
            <h3 class="font-medium text-yellow-800 flex items-center"><i class="fa fa-exclamation-triangle mr-2"></i>认领须知</h3>
            <ul class="text-sm text-yellow-700 mt-2 space-y-1 ml-5 list-disc">
                <li>请如实填写认领信息，核实物品特征</li>
                <li>认领时请携带有效身份证件</li>
                <li>提交申请后请耐心等待发布者联系</li>
            </ul>
        </div>
    </div>

    <div id="claimModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md mx-4">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-xl font-bold text-gray-800">申请认领</h3>
                <button onclick="closeClaimModal()" class="text-gray-400 hover:text-gray-600"><i class="fa fa-times text-xl"></i></button>
            </div>
            <form id="claimForm">
                <input type="hidden" id="infoId">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">您的联系方式 <span class="text-red-500">*</span></label>
                    <input type="text" name="contact" required placeholder="请输入手机号或微信号" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl">
                </div>
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-1">认领说明 <span class="text-red-500">*</span></label>
                    <textarea name="reason" rows="4" required placeholder="请描述物品特征以证明您是失主..." class="w-full px-4 py-2.5 border border-gray-200 rounded-xl resize-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-green-500 to-green-600 text-white py-3 rounded-xl font-medium">提交认领申请</button>
            </form>
        </div>
    </div>

    <div id="successModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl p-8 text-center max-w-sm mx-4">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa fa-check text-green-500 text-2xl"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">提交成功！</h3>
            <p class="text-gray-500 mb-6">认领申请已提交，请等待发布者联系您</p>
            <button onclick="location.href='index.html'" class="w-full bg-gradient-to-r from-blue-500 to-blue-600 text-white py-3 rounded-xl font-medium">返回首页</button>
        </div>
    </div>

    <div id="errorModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl p-8 text-center max-w-sm mx-4">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa fa-exclamation-triangle text-red-500 text-2xl"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">加载失败</h3>
            <p class="text-gray-500 mb-6" id="detailErrorMsg"></p>
            <button onclick="location.href='index.html'" class="w-full bg-gray-500 text-white py-2.5 rounded-xl font-medium">返回首页</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3001/api/lost';
        let currentId = null;

        function getTitle(item) {
            if (item.title && item.title.trim() !== '') {
                return item.title.trim();
            }
            let goods = item.goods_type || '物品';
            return item.type === 2 ? `✨ 招领${goods}` : `🔍 寻找${goods}`;
        }

        async function loadDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            currentId = urlParams.get('id');
            if (!currentId) currentId = '1';
            document.getElementById('infoId').value = currentId;
            
            try {
                const res = await fetch(API_BASE + '/detail/' + currentId);
                const result = await res.json();
                console.log('详情返回:', result);
                
                if (result.code === 200 && result.data) {
                    renderDetail(result.data);
                } else {
                    throw new Error('数据格式错误');
                }
            } catch(e) {
                console.error('加载失败:', e);
                document.getElementById('errorModal').classList.remove('hidden');
                document.getElementById('detailErrorMsg').innerText = '后端服务未启动！请先启动后端服务 (node server.js)';
            }
        }

        function renderDetail(item) {
            document.getElementById('detailTitle').innerText = getTitle(item);
            document.getElementById('goodsType').innerText = item.goods_type || '其他';
            document.getElementById('location').innerText = item.location || '未填写地点';
            
            const descText = (item.description && item.description.trim() !== '') ? item.description : '暂无详细描述';
            document.getElementById('description').innerText = descText;
            console.log('描述内容:', descText);
            
            document.getElementById('contact').innerText = item.contact || '未提供联系方式';
            
            if (item.create_time) {
                let d = new Date(item.create_time);
                if (!isNaN(d.getTime())) {
                    document.getElementById('timeText').innerHTML = `<i class="fa fa-clock-o mr-1"></i>${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
                }
            }
            
            const typeTag = document.getElementById('typeTag');
            if (item.type === 1) {
                typeTag.innerText = '🔍 寻物启事';
                typeTag.className = 'px-3 py-1.5 rounded-full text-sm font-medium bg-orange-100 text-orange-600';
            } else {
                typeTag.innerText = '🤲 招领信息';
                typeTag.className = 'px-3 py-1.5 rounded-full text-sm font-medium bg-green-100 text-green-600';
            }
            
            const statusTag = document.getElementById('statusTag');
            const claimBtn = document.getElementById('claimBtn');
            if (item.status === 1) {
                statusTag.innerText = '📋 未认领';
                statusTag.className = 'px-3 py-1.5 rounded-full text-sm font-medium bg-blue-100 text-blue-600';
                claimBtn.style.display = 'flex';
            } else {
                statusTag.innerText = '✅ 已认领';
                statusTag.className = 'px-3 py-1.5 rounded-full text-sm font-medium bg-gray-100 text-gray-500';
                claimBtn.style.display = 'none';
            }
        }

        function openClaimModal() {
            document.getElementById('claimModal').classList.remove('hidden');
        }
        function closeClaimModal() {
            document.getElementById('claimModal').classList.add('hidden');
        }
        
        document.getElementById('claimForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            closeClaimModal();
            document.getElementById('successModal').classList.remove('hidden');
        });

        loadDetail();
    </script>
</body>
</html>
