<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <base href="/bike/">
  <title>故障报修</title>
  <link rel="stylesheet" href="common.css" />
  <script src="config.js"></script>
</head>
<body>
  <main class="container site-main">
    <section class="page-header">
      <h1 class="page-title">故障报修</h1>
      <p class="page-subtitle">填写单车ID与故障原因，快速提交维修申请。</p>
    </section>

    <section class="card">
      <div class="form-grid">
        <div>
          <label for="bikeId">单车ID</label>
          <input id="bikeId" type="number" min="1" placeholder="输入故障单车ID，例如 1" />
        </div>
        <div>
          <label for="reason">故障原因</label>
          <textarea id="reason" placeholder="填写故障情况，如车锁损坏、轮胎漏气等"></textarea>
        </div>
        <div></div>
        <button class="btn btn-primary" onclick="reportRepair()">提交报修</button>
      </div>
      <div id="message" class="message-box"></div>
    </section>

    <section class="card">
      <h2>报修说明</h2>
      <p>请填写单车ID与故障原因，系统会自动写入故障报修表并提示管理员处理。</p>
      <p>若单车仍显示“可借用”，请等待管理员更新状态后再次查询。</p>
    </section>

    <div class="footer">
      <a href="index.html">返回首页</a>
      <a href="borrow.html">借车页面</a>
      <a href="record.html">我的骑行记录</a>
      <a href="payment.html">订单支付</a>
    </div>
  </main>

  <script src="common.js"></script>
  <script>
    async function reportRepair() {
      const bikeId = document.getElementById('bikeId').value.trim();
      const reason = document.getElementById('reason').value.trim();
      if (!bikeId || !reason) {
        showMessage('message', '请填写单车ID和故障原因。', false);
        return;
      }
      const data = await apiPost('report_repair', { bike_id: bikeId, reason });
      showMessage('message', data.message, data.success);
    }
  </script>
</body>
</html>
