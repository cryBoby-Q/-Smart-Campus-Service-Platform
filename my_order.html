<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 校园二手交易</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background-color: #f5f5f5; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; text-align: center; }
        .nav { display: flex; justify-content: center; gap: 20px; margin-top: 15px; flex-wrap: wrap; }
        .nav a { color: white; text-decoration: none; padding: 8px 20px; border-radius: 20px; background: rgba(255,255,255,0.2); transition: all 0.3s; }
        .nav a:hover, .nav a.active { background: white; color: #667eea; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .page-title { font-size: 24px; font-weight: bold; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #f57c00; }
        .order-card { background: white; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        .order-header { background: #f9f9f9; padding: 15px 20px; display: flex; justify-content: space-between; border-bottom: 1px solid #eee; }
        .order-num { font-weight: bold; }
        .order-status { font-weight: bold; color: #f57c00; }
        .order-status.paid { color: #4caf50; }
        .order-status.completed { color: #4caf50; }
        .order-status.cancelled { color: #999; }
        .order-items { padding: 15px 20px; }
        .order-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
        .item-info { display: flex; align-items: center; gap: 15px; }
        .item-icon { font-size: 30px; }
        .item-title { font-weight: bold; }
        .item-price { color: #f44336; }
        .order-footer { padding: 15px 20px; background: #f9f9f9; display: flex; justify-content: space-between; align-items: center; }
        .order-total { font-weight: bold; font-size: 18px; }
        .order-total span { color: #f44336; }
        .order-buttons { display: flex; gap: 10px; }
        .btn { padding: 8px 20px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-cancel { background: #ffebee; color: #c62828; }
        .empty, .loading { text-align: center; padding: 80px; color: #999; background: white; border-radius: 10px; }
        .tip { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 15px 30px; border-radius: 8px; color: white; z-index: 9999; display: none; }
        .tip.success { background: #4caf50; display: block; }
        .tip.error { background: #f44336; display: block; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎓 校园二手交易平台</h1>
        <div class="nav">
            <a href="/second/index.html">首页</a>
            <a href="/second/publish.html">发布闲置</a>
            <a href="/second/my_publish.html">我的发布</a>
            <a href="/second/my_collect.html">我的收藏</a>
            <a href="/second/my_order.html" class="active">我的订单</a>
        </div>
    </div>

    <div class="container">
        <div class="page-title">📦 我的订单</div>
        <div id="orderList"><div class="loading">⏳ 加载中...</div></div>
    </div>
    <div id="tip" class="tip"></div>

    <script>
        const currentUserId = 1;
        const API_BASE = 'http://localhost:3000';

        function showTip(msg, type) {
            const tip = document.getElementById('tip');
            tip.textContent = type === 'success' ? '✅ ' + msg : '❌ ' + msg;
            tip.className = 'tip ' + type;
            setTimeout(() => { tip.style.display = 'none'; }, 2000);
        }

        function getStatusText(status) {
            const map = { '待付款': '⏳ 待付款', '已付款': '✅ 已付款', '已发货': '📦 已发货', '已完成': '🎉 已完成', '已取消': '❌ 已取消' };
            return map[status] || status;
        }

        window.onload = () => { loadOrders(); };

        function loadOrders() {
            fetch(`${API_BASE}/api/order/list?user_id=${currentUserId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.data.length > 0) {
                        Promise.all(data.data.map(order => 
                            fetch(`${API_BASE}/api/order/detail?order_id=${order.id}`).then(res => res.json())
                        )).then(results => {
                            let html = '';
                            results.forEach(result => {
                                if (result.success) {
                                    const order = result.data.order;
                                    const items = result.data.items;
                                    html += `<div class="order-card">
                                        <div class="order-header">
                                            <span class="order-num">订单号：${order.order_no}</span>
                                            <span class="order-status ${order.status === '已付款' ? 'paid' : (order.status === '已完成' ? 'completed' : (order.status === '已取消' ? 'cancelled' : ''))}">${getStatusText(order.status)}</span>
                                        </div>
                                        <div class="order-items">${items.map(item => `
                                            <div class="order-item">
                                                <div class="item-info"><span class="item-icon">${item.goods_title.includes('书') ? '📖' : '📦'}</span><span class="item-title">${item.goods_title}</span></div>
                                                <div>¥${item.goods_price} × ${item.quantity} = <span class="item-price">¥${item.total_price}</span></div>
                                            </div>
                                        `).join('')}</div>
                                        <div class="order-footer">
                                            <div class="order-total">共${items.length}件商品 总计：<span>¥${order.total_amount}</span></div>
                                            <div class="order-buttons">${order.status === '待付款' ? `<button class="btn btn-primary" onclick="payOrder(${order.id})">立即付款</button><button class="btn btn-cancel" onclick="cancelOrder(${order.id})">取消订单</button>` : (order.status === '已付款' ? `<button class="btn btn-primary" onclick="confirmReceive(${order.id})">确认收货</button>` : '')}</div>
                                        </div>
                                    </div>`;
                                }
                            });
                            document.getElementById('orderList').innerHTML = html;
                        });
                    } else {
                        document.getElementById('orderList').innerHTML = '<div class="empty">📦 暂无订单，去首页逛逛吧~</div>';
                    }
                }).catch(() => { document.getElementById('orderList').innerHTML = '<div class="empty">❌ 加载失败</div>'; });
        }

        function payOrder(orderId) {
            fetch(`${API_BASE}/api/order/status`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order_id: orderId, status: '已付款' })
            }).then(res => res.json()).then(data => {
                if (data.success) { showTip('付款成功！', 'success'); loadOrders(); }
                else showTip(data.message || '付款失败', 'error');
            });
        }

        function confirmReceive(orderId) {
            fetch(`${API_BASE}/api/order/status`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order_id: orderId, status: '已完成' })
            }).then(res => res.json()).then(data => {
                if (data.success) { showTip('已确认收货！', 'success'); loadOrders(); }
                else showTip(data.message || '操作失败', 'error');
            });
        }

        function cancelOrder(orderId) {
            if (confirm('确定要取消这个订单吗？')) {
                fetch(`${API_BASE}/api/order/cancel`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_id: orderId })
                }).then(res => res.json()).then(data => {
                    if (data.success) { showTip('订单已取消', 'success'); loadOrders(); }
                    else showTip(data.message || '取消失败', 'error');
                });
            }
        }
    </script>
</body>
</html>
